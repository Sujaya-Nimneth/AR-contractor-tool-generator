name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Domain tests, app unit tests, lint, and debug APK
        run: ./gradlew :core-domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Release R8 and resource shrinking check
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Assert persisted names survived R8
        run: |
          set -euo pipefail
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          for entry in \
            "com.arcontractor.estimator.ui.ar.ArMeasurePhase" \
            "com.arcontractor.estimator.domain.geometry.CutoutKind" \
            "com.arcontractor.estimator.domain.estimation.WastePreset" \
            "com.arcontractor.estimator.domain.estimation.TaxPolicy"; do
            if ! grep -q "^$entry -> $entry:" "$MAPPING"; then
              echo "::error::$entry was obfuscated; saved quotes would not deserialize."
              exit 1
            fi
          done
          for constant in \
            "CutoutKind DOOR -> DOOR" \
            "CutoutKind WINDOW -> WINDOW" \
            "WastePreset CUSTOM -> CUSTOM" \
            "WastePreset STRAIGHT_LAY -> STRAIGHT_LAY" \
            "TaxPolicy TAX_TOTAL_SUBTOTAL -> TAX_TOTAL_SUBTOTAL"; do
            if ! grep -q "$constant" "$MAPPING"; then
              echo "::error::Enum constant '$constant' was renamed by R8."
              exit 1
            fi
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core-domain/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
