name: Release APK

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Optional versionName override (e.g. 1.2.0)"
        required: false
        type: string

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_PACKAGE: com.arcontractor.estimator
  ARTIFACT_BASE: ar-contractor-estimator
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  release:
    name: Verify, sign and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verification gate
        run: |
          ./gradlew :core-domain:test :app:testDebugUnitTest :app:lintDebug \
            :app:compileDebugAndroidTestKotlin --console=plain

      - name: Compute monotonic version
        id: version
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --count HEAD)"
          VERSION_CODE="$((COUNT + 100))"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.versionName }}" ]]; then
            VERSION_NAME="${{ inputs.versionName }}"
          else
            VERSION_NAME="1.0.${COUNT}"
          fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "shortSha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION_NAME ($VERSION_CODE) from $SHORT_SHA"

      - name: Fail fast when signing secrets are missing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [[ -z "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "::error::Missing secret ANDROID_KEY_ALIAS"
            exit 1
          fi
          if [[ -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "::error::Missing secret ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PsplitApks \
            -PappVersionCode=${{ steps.version.outputs.versionCode }} \
            -PappVersionName=${{ steps.version.outputs.versionName }} \
            -PappGitSha=${{ steps.version.outputs.shortSha }}

      - name: Verify every APK signature
        run: |
          set -euo pipefail
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $APK"
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify \
              --verbose --print-certs "$APK"
          done

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
            IS_TAG=true
          else
            SUFFIX="latest"
            IS_TAG=false
          fi

          ARM64_SRC="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          UNIVERSAL_SRC="app/build/outputs/apk/release/app-universal-release.apk"
          ARM64_NAME="${ARTIFACT_BASE}-arm64-v8a-${SUFFIX}.apk"
          UNIVERSAL_NAME="${ARTIFACT_BASE}-universal-${SUFFIX}.apk"
          cp "$ARM64_SRC" "release-assets/$ARM64_NAME"
          cp "$UNIVERSAL_SRC" "release-assets/$UNIVERSAL_NAME"
          # Stable short name so releases/latest/download/... always works.
          cp "$UNIVERSAL_SRC" "release-assets/${ARTIFACT_BASE}-${SUFFIX}.apk"

          ARM64_SHA256="$(sha256sum "release-assets/$ARM64_NAME" | awk '{print $1}')"
          UNIVERSAL_SHA256="$(sha256sum "release-assets/$UNIVERSAL_NAME" | awk '{print $1}')"
          ARM64_SIZE="$(stat -c%s "release-assets/$ARM64_NAME")"
          UNIVERSAL_SIZE="$(stat -c%s "release-assets/$UNIVERSAL_NAME")"
          (
            cd release-assets
            sha256sum ./*.apk > SHA256SUMS.txt
          )

          if [[ "$IS_TAG" == "true" ]]; then
            BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          else
            BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"
          fi
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --argjson versionCode "${{ steps.version.outputs.versionCode }}" \
            --arg versionName "${{ steps.version.outputs.versionName }}" \
            --arg gitSha "${{ steps.version.outputs.shortSha }}" \
            --arg builtAtUtc "$BUILT_AT" \
            --arg arm64Name "$ARM64_NAME" \
            --arg arm64Sha256 "$ARM64_SHA256" \
            --argjson arm64Size "$ARM64_SIZE" \
            --arg universalName "$UNIVERSAL_NAME" \
            --arg universalSha256 "$UNIVERSAL_SHA256" \
            --argjson universalSize "$UNIVERSAL_SIZE" \
            --arg baseUrl "$BASE_URL" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              gitSha: $gitSha,
              builtAtUtc: $builtAtUtc,
              apkFileName: $universalName,
              apkSha256: $universalSha256,
              apkSizeBytes: $universalSize,
              downloadUrl: ($baseUrl + "/" + $universalName),
              variants: [
                {
                  abi: "arm64-v8a",
                  apkFileName: $arm64Name,
                  apkSha256: $arm64Sha256,
                  apkSizeBytes: $arm64Size,
                  downloadUrl: ($baseUrl + "/" + $arm64Name)
                },
                {
                  abi: "universal",
                  apkFileName: $universalName,
                  apkSha256: $universalSha256,
                  apkSizeBytes: $universalSize,
                  downloadUrl: ($baseUrl + "/" + $universalName)
                }
              ]
            }' > release-assets/version.json
          echo "isTag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "arm64Name=$ARM64_NAME" >> "$GITHUB_OUTPUT"
          echo "arm64Sha256=$ARM64_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload mapping for crash deobfuscation
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.versionCode }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}-${{ steps.version.outputs.versionName }}
          path: release-assets/*
          retention-days: 30

      - name: Publish rolling latest release
        if: steps.stage.outputs.isTag == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Automated build of \`main\` at commit \`${{ steps.version.outputs.shortSha }}\`."
            echo
            echo "- Version: **${{ steps.version.outputs.versionName }}** (code ${{ steps.version.outputs.versionCode }})"
            echo "- arm64-v8a APK: \`${{ steps.stage.outputs.arm64Name }}\` (SHA-256 \`${{ steps.stage.outputs.arm64Sha256 }}\`)"
            echo
            echo "### Recent commits"
            git log -12 --pretty=format:'- %s (%h)'
            echo
          } > "$NOTES"
          git tag -f latest HEAD
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build (${{ steps.version.outputs.versionName }})" --notes-file "$NOTES"
            gh release upload latest release-assets/* --clobber
          else
            gh release create latest release-assets/* \
              --title "Latest build (${{ steps.version.outputs.versionName }})" \
              --notes-file "$NOTES" \
              --prerelease=false
          fi

      - name: Publish immutable versioned release
        if: steps.stage.outputs.isTag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --title "AR Contractor Estimator ${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi

      - name: Clean up signing material
        if: always()
        run: rm -f "${KEYSTORE_PATH:-/nonexistent}"
